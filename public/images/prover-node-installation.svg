<svg width="880" height="520" viewBox="0 0 880 520" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#06c19d"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="878" height="518" rx="14" fill="#0a2540" stroke="#123655" stroke-width="1.5"/>

  <!-- title -->
  <g transform="translate(28,26)">
    <svg x="0" y="-14" width="20" height="20" viewBox="0 0 120 120"><g fill="none" stroke="#06c19d" stroke-width="10" stroke-linejoin="miter"><path d="M16 20 H104 V38 H88 V84 H72 V38 H48 V84 H32 V38 H16 Z"/><rect x="22" y="86" width="28" height="16"/><rect x="70" y="90" width="30" height="16"/></g></svg>
    <text x="30" y="2" fill="#e6edf3" font-size="15" font-weight="700">Prover Node installation overview</text>
    <text x="30" y="20" fill="#7fa0b8" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0.3">from whitelisted address to a node that proves</text>
  </g>

  <!-- prerequisites strip -->
  <g>
    <rect x="28" y="64" width="824" height="60" rx="9" fill="#12314a" stroke="#2f6aa8" stroke-width="1.4"/>
    <text x="44" y="88" fill="#8fb0c6" font-size="11" font-family="ui-monospace, monospace" letter-spacing="0.6" text-transform="uppercase">BEFORE YOU START</text>
    <g font-size="12" fill="#cfe0ee">
      <circle cx="48" cy="104" r="3" fill="#4a90d9"/><text x="58" y="108">Mainnet ETH address whitelisted by Fermah</text>
      <circle cx="352" cy="104" r="3" fill="#4a90d9"/><text x="362" y="108">AWS KMS signer key ready</text>
      <circle cx="576" cy="104" r="3" fill="#4a90d9"/><text x="586" y="108">assigned prover node name</text>
    </g>
  </g>

  <!-- stage 1: prepare the server -->
  <g>
    <rect x="28" y="150" width="824" height="150" rx="10" fill="#0e2233" stroke="#245073" stroke-width="1.4"/>
    <text x="44" y="176" fill="#e6b94f" font-size="12.5" font-weight="700">1 &#183; Prepare the server</text>
    <text x="44" y="194" fill="#7fa0b8" font-size="11">Ubuntu host with GPUs, both Docker modes and CUDA in place</text>
    <g>
      <rect x="44" y="212" width="188" height="70" rx="8" fill="#132b3d" stroke="#3a6ea5" stroke-width="1.3"/>
      <text x="138" y="240" fill="#dce9f4" font-size="12.5" font-weight="600" text-anchor="middle">Root Docker</text>
      <text x="138" y="260" fill="#8fb0c6" font-size="10.5" text-anchor="middle">telemetry collector,</text>
      <text x="138" y="274" fill="#8fb0c6" font-size="10.5" text-anchor="middle">host metrics</text>

      <rect x="246" y="212" width="188" height="70" rx="8" fill="#132b3d" stroke="#3a6ea5" stroke-width="1.3"/>
      <text x="340" y="240" fill="#dce9f4" font-size="12.5" font-weight="600" text-anchor="middle">Rootless Docker</text>
      <text x="340" y="260" fill="#8fb0c6" font-size="10.5" text-anchor="middle">runs the prover</text>
      <text x="340" y="274" fill="#8fb0c6" font-size="10.5" text-anchor="middle">containers</text>

      <rect x="448" y="212" width="188" height="70" rx="8" fill="#132b3d" stroke="#3a6ea5" stroke-width="1.3"/>
      <text x="542" y="240" fill="#dce9f4" font-size="12.5" font-weight="600" text-anchor="middle">CUDA drivers</text>
      <text x="542" y="260" fill="#8fb0c6" font-size="10.5" text-anchor="middle">GPU access on</text>
      <text x="542" y="274" fill="#8fb0c6" font-size="10.5" text-anchor="middle">the host</text>

      <rect x="650" y="212" width="186" height="70" rx="8" fill="#132b3d" stroke="#3a6ea5" stroke-width="1.3"/>
      <text x="743" y="240" fill="#dce9f4" font-size="12.5" font-weight="600" text-anchor="middle">CUDA toolkit</text>
      <text x="743" y="260" fill="#8fb0c6" font-size="10.5" text-anchor="middle">for rootless,</text>
      <text x="743" y="274" fill="#8fb0c6" font-size="10.5" text-anchor="middle">verify sample</text>
    </g>
  </g>
  <line x1="440" y1="300" x2="440" y2="326" stroke="#06c19d" stroke-width="2" marker-end="url(#a)"/>

  <!-- stage 2: install the prover node -->
  <g>
    <rect x="28" y="326" width="824" height="70" rx="10" fill="#0e2233" stroke="#245073" stroke-width="1.4"/>
    <text x="44" y="352" fill="#e6b94f" font-size="12.5" font-weight="700">2 &#183; Install the Fermah Prover Node</text>
    <text x="44" y="374" fill="#a9c2d6" font-size="11.5">Run the install script and provide your node name; it fetches the right config. AWS KMS remote signer supported.</text>
  </g>
  <line x1="440" y1="396" x2="440" y2="422" stroke="#06c19d" stroke-width="2" marker-end="url(#a)"/>

  <!-- stage 3: node proves -->
  <g>
    <rect x="28" y="422" width="824" height="72" rx="10" fill="#0e2e34" stroke="#2f8f86" stroke-width="1.6"/>
    <svg x="46" y="440" width="22" height="22" viewBox="0 0 120 120"><g fill="none" stroke="#1ee3cf" stroke-width="10" stroke-linejoin="miter"><path d="M16 20 H104 V38 H88 V84 H72 V38 H48 V84 H32 V38 H16 Z"/><rect x="22" y="86" width="28" height="16"/><rect x="70" y="90" width="30" height="16"/></g></svg>
    <text x="80" y="452" fill="#bfe9e2" font-size="13" font-weight="700">Prover Node joins the network</text>
    <text x="80" y="472" fill="#84b8b2" font-size="11.5">The Matchmaker assigns Proof Requests and your node starts generating proofs.</text>
  </g>
</svg>
