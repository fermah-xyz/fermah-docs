<svg width="860" height="460" viewBox="0 0 860 460" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#06c19d"/>
    </marker>
    <marker id="arrowBack" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5eead4"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="858" height="458" rx="14" fill="#0a2540" stroke="#123655" stroke-width="1.5"/>

  <!-- title + mark -->
  <g transform="translate(28,26)">
    <svg x="0" y="-14" width="20" height="20" viewBox="0 0 120 120"><g fill="none" stroke="#06c19d" stroke-width="10" stroke-linejoin="miter"><path d="M16 20 H104 V38 H88 V84 H72 V38 H48 V84 H32 V38 H16 Z"/><rect x="22" y="86" width="28" height="16"/><rect x="70" y="90" width="30" height="16"/></g></svg>
    <text x="30" y="2" fill="#e6edf3" font-size="15" font-weight="700" letter-spacing="0.3">Fermah network components</text>
    <text x="30" y="20" fill="#7fa0b8" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0.4">Seekers &#183; Core &#183; Prover Nodes</text>
  </g>

  <!-- Seekers (blue) -->
  <g>
    <rect x="30" y="150" width="190" height="96" rx="10" fill="#12314a" stroke="#4a90d9" stroke-width="2"/>
    <rect x="30" y="150" width="190" height="28" rx="10" fill="#4a90d9"/>
    <rect x="30" y="164" width="190" height="14" fill="#4a90d9"/>
    <text x="125" y="169" fill="#04131e" font-size="13.5" font-weight="700" text-anchor="middle">Seekers</text>
    <text x="125" y="200" fill="#cfe0ee" font-size="11.5" text-anchor="middle">Submit Proof Requests</text>
    <text x="125" y="218" fill="#8fb0c6" font-size="11" text-anchor="middle">through custom dev tooling</text>
    <text x="125" y="236" fill="#8fb0c6" font-size="11" text-anchor="middle">(whitelisted)</text>
  </g>

  <!-- Core (orange) -->
  <g>
    <rect x="335" y="150" width="190" height="96" rx="10" fill="#3a2a17" stroke="#e6922e" stroke-width="2"/>
    <rect x="335" y="150" width="190" height="28" rx="10" fill="#e6922e"/>
    <rect x="335" y="164" width="190" height="14" fill="#e6922e"/>
    <text x="430" y="169" fill="#2a1607" font-size="13.5" font-weight="700" text-anchor="middle">Core</text>
    <text x="430" y="200" fill="#f0dcc4" font-size="11.5" text-anchor="middle">Orchestrates the network</text>
    <text x="430" y="218" fill="#c9a982" font-size="11" text-anchor="middle">matches requests to nodes,</text>
    <text x="430" y="236" fill="#c9a982" font-size="11" text-anchor="middle">assigns tasks</text>
  </g>

  <!-- Prover Nodes (yellow) -->
  <g>
    <rect x="646" y="138" width="184" height="34" rx="8" fill="#3a341a" stroke="#e6b94f" stroke-width="1.6"/>
    <rect x="640" y="150" width="184" height="34" rx="8" fill="#3a341a" stroke="#e6b94f" stroke-width="1.6"/>
    <rect x="634" y="162" width="190" height="72" rx="9" fill="#3a341a" stroke="#e6b94f" stroke-width="2"/>
    <rect x="634" y="162" width="190" height="26" rx="9" fill="#e6b94f"/>
    <rect x="634" y="175" width="190" height="13" fill="#e6b94f"/>
    <text x="729" y="180" fill="#2a2407" font-size="13" font-weight="700" text-anchor="middle">Prover Nodes</text>
    <text x="729" y="206" fill="#efe4c4" font-size="11.5" text-anchor="middle">Run the Prover Binary</text>
    <text x="729" y="224" fill="#cbbd8f" font-size="11" text-anchor="middle">GPUs and CPUs</text>
  </g>

  <!-- Storage Layer (neutral teal) -->
  <g>
    <rect x="335" y="340" width="190" height="72" rx="10" fill="#0e2e34" stroke="#2f8f86" stroke-width="1.8"/>
    <text x="430" y="372" fill="#bfe9e2" font-size="13" font-weight="700" text-anchor="middle">Storage Layer</text>
    <text x="430" y="392" fill="#84b8b2" font-size="11" text-anchor="middle">holds completed proofs</text>
  </g>

  <!-- flow arrows -->
  <!-- Seekers -> Core -->
  <line x1="220" y1="198" x2="333" y2="198" stroke="#06c19d" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="276" y="189" fill="#9fe3d6" font-size="10.5" text-anchor="middle" font-family="ui-monospace, monospace">Proof Request</text>
  <!-- Core -> Prover Nodes -->
  <line x1="525" y1="198" x2="632" y2="198" stroke="#06c19d" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="578" y="189" fill="#9fe3d6" font-size="10.5" text-anchor="middle" font-family="ui-monospace, monospace">assign task</text>
  <!-- Prover Nodes -> Storage (proof) -->
  <path d="M729 234 L729 376 L527 376" fill="none" stroke="#06c19d" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="352" fill="#9fe3d6" font-size="10.5" text-anchor="middle" font-family="ui-monospace, monospace">completed proof</text>
  <!-- Storage -> Seekers (callback) -->
  <path d="M335 388 L125 388 L125 248" fill="none" stroke="#5eead4" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowBack)"/>
  <text x="228" y="404" fill="#7fdccb" font-size="10.5" text-anchor="middle" font-family="ui-monospace, monospace">submitted to callback URL</text>
</svg>
